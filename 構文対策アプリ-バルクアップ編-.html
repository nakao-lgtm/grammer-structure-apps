<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語構文 マッチョ ドリル</title>
<style>
  :root{
    --navy-deep:#070d1f;
    --navy:#0d1730;
    --navy-card:#121f42;
    --navy-card-2:#16264e;
    --line:#2a3a66;
    --amber:#f2b134;
    --amber-soft:#f2b13433;
    --teal:#4fd1c5;
    --pink:#ff8fa3;
    --text:#eef1fb;
    --text-dim:#9aa6c9;
    --wrong:#ff6b6b;
    --correct:#5ee6a4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #1a2b58 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #142046 0%, transparent 50%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    background-attachment:fixed;
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:0;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:transparent;
    position:relative;
    padding-bottom:40px;
  }

  /* ---------- Header ---------- */
  header{
    padding:34px 24px 20px;
    position:relative;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:11.5px;
    letter-spacing:.14em;
    color:var(--teal);
    background:#0f2d34;
    border:1px solid #1d4a4f;
    padding:5px 12px;
    border-radius:999px;
    margin:0 0 10px;
  }
  h1{
    font-size:28px;
    font-weight:800;
    margin:0;
    color:var(--text);
    line-height:1.3;
    letter-spacing:.01em;
  }
  h1 span{
    display:inline-block;
    color:var(--amber);
  }
  .sub{
    margin:10px 0 0;
    font-size:13.5px;
    color:var(--text-dim);
  }

  /* ---------- Menu (index card box) ---------- */
  .card-box{
    padding:8px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:linear-gradient(180deg,var(--navy-card),var(--navy-card-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 16px;
    cursor:pointer;
    position:relative;
    box-shadow:0 14px 34px -18px #000a, inset 0 1px 0 #ffffff0d;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{
    transform:translateY(1px);
  }
  .card.disabled{
    cursor:default;
    opacity:.5;
  }
  .card.has-modes{
    cursor:default;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .card-index{
    font-size:11px;
    color:var(--amber);
    letter-spacing:.1em;
  }
  .card-title{
    font-size:19px;
    font-weight:800;
    color:var(--text);
    margin:4px 0 6px;
  }
  .card-desc{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .card-status{
    position:absolute;
    top:14px;
    right:16px;
    font-size:10px;
    letter-spacing:.06em;
    padding:3px 8px;
    border-radius:20px;
  }
  .status-ready{
    background:var(--amber-soft);
    color:var(--amber);
  }
  .status-soon{
    background:#101c3b;
    color:var(--text-dim);
    border:1px solid var(--line);
  }
  .card-progress{
    margin-top:10px;
    font-size:11px;
    color:var(--teal);
    opacity:.9;
  }
  .mode-choice{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .mode-choice-btn{
    flex:1 1 auto;
    font-size:11px;
    letter-spacing:.02em;
    padding:9px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#101c3b;
    color:var(--text-dim);
    cursor:pointer;
    transition:all .12s ease;
  }
  .mode-choice-btn:hover{
    background:var(--amber);
    color:var(--navy-deep);
    border-color:var(--amber);
  }

  /* ---------- Quiz screen ---------- */
  .quiz-wrap{ display:none; padding:6px 20px 30px; }
  .quiz-wrap.active{ display:block; }
  .app.on-quiz .card-box{ display:none; }
  .app.on-quiz header{ display:none; }

  .quiz-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:24px 0 18px;
  }
  .back-btn{
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .quiz-title{
    font-size:19px;
    font-weight:800;
    color:var(--text);
  }
  .progress-bar-track{
    height:6px;
    background:#101c3b;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--amber));
    width:0%;
    transition:width .3s ease;
  }
  .embed-frame{
    width:100%;
    height:78vh;
    min-height:520px;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 14px 34px -18px #000a;
    display:block;
  }
  .qcount{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }

  .question-card{
    background:linear-gradient(180deg,var(--navy-card),var(--navy-card-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 22px;
    box-shadow:0 14px 34px -18px #000a;
  }
  .qtag{
    display:inline-block;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--amber);
    border:1px solid var(--amber);
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .qtext{
    font-size:17px;
    line-height:1.85;
    margin:0 0 20px;
    color:var(--text);
  }
  .qtext .blank{
    display:inline-block;
    min-width:70px;
    border-bottom:2px solid var(--teal);
    text-align:center;
    color:var(--amber);
    font-weight:600;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    background:#101c3b;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .option .opt-key{
    color:var(--teal);
    font-weight:700;
    flex-shrink:0;
  }
  .option:hover{ border-color:var(--teal); }
  .option.correct{
    background:#0f3327;
    border-color:var(--correct);
  }
  .option.correct .opt-key{ color:var(--correct); }
  .option.wrong{
    background:#3a1620;
    border-color:var(--wrong);
  }
  .option.wrong .opt-key{ color:var(--wrong); }
  .option[disabled]{ cursor:default; }

  .explain{
    margin-top:16px;
    padding:14px 16px;
    background:#101c3b;
    border-left:4px solid var(--amber);
    font-size:13px;
    line-height:1.7;
    color:var(--text-dim);
    border-radius:8px;
    display:none;
  }
  .explain.show{ display:block; }
  .explain b{ color:var(--text); }

  .next-row{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
  }
  .next-btn{
    font-size:12.5px;
    font-weight:700;
    background:var(--amber);
    color:var(--navy-deep);
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .next-btn:hover{ filter:brightness(1.08); }

  /* ---------- Result screen ---------- */
  .result-card{
    background:linear-gradient(180deg,var(--navy-card),var(--navy-card-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:34px 24px;
    text-align:center;
    box-shadow:0 14px 34px -18px #000a;
  }
  .result-score{
    font-size:40px;
    font-weight:800;
    color:var(--text);
    margin:6px 0 4px;
  }
  .result-score span{ font-size:18px; color:var(--text-dim); }
  .result-msg{
    font-size:13.5px;
    color:var(--text-dim);
    margin-bottom:24px;
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .result-actions button{
    font-size:12.5px;
    font-weight:700;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .retry-btn{ background:var(--amber); color:var(--navy-deep); border-color:var(--amber); }
  .menu-btn{ background:none; color:var(--text-dim); }

  footer{
    text-align:center;
    font-size:10.5px;
    color:#4c5788;
    padding:20px 0 6px;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <p class="eyebrow">💪 SENTENCE STRUCTURE DRILL</p>
    <h1><span>英語構文</span> マッチョ ドリル</h1>
    <p class="sub">文法メニューを選んで、構文筋トレを始めたまえ。目指せ、英語マッチョ！</p>
  </header>

  <div class="card-box" id="cardBox"></div>

  <div class="quiz-wrap" id="quizWrap">
    <div class="quiz-header">
      <button class="back-btn" id="backBtn">← メニュー</button>
      <div class="quiz-title" id="quizTitle"></div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progFill"></div></div>
    <div id="quizBody"></div>
  </div>

  <footer>― 英語構文 マッチョ ドリル / 学習用アプリ ―</footer>
</div>

<script>
/* =====================================================================
   DATA
   新しい文法項目を追加する場合は、この GRAMMAR_ITEMS 配列に
   オブジェクトを1つ追加するだけでよい。
   comingSoon:true にすると「準備中」カードとしてメニューに表示され、
   タップしても遷移しない。
   count: 問題数を指定すると、メニューのタイトルに「（○問）」と表示される。
   questions 配列に問題を書けば自動的にクイズが動作する。
===================================================================== */
const GRAMMAR_ITEMS = [
  {
    id: "five-patterns",
    index: "01",
    title: "5文型",
    desc: "\"5文型 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-five-patterns",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "tense",
    index: "02",
    title: "時制",
    desc: "\"時制 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-tense",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "auxiliary",
    index: "03",
    title: "助動詞",
    desc: "\"助動詞 筋\"をバルクアップ！",
    comingSoon: false,
    count: 25,
    embedSrc: "embed-auxiliary",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "passive",
    index: "04",
    title: "受動態",
    desc: "\"受動態 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-passive",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "infinitive",
    index: "05",
    title: "不定詞",
    desc: "\"不定詞 筋\"をバルクアップ！",
    comingSoon: false,
    count: 25,
    embedSrc: "embed-infinitive",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "gerund",
    index: "06",
    title: "動名詞",
    desc: "\"動名詞 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-gerund",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "participle",
    index: "07",
    title: "分詞",
    desc: "\"分詞 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-participle",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "relative",
    index: "08",
    title: "関係詞",
    desc: "\"関係詞 筋\"をバルクアップ！",
    comingSoon: false,
    count: 25,
    embedSrc: "embed-relative",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "comparison",
    index: "09",
    title: "比較",
    desc: "\"比較 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-comparison",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "subjunctive",
    index: "10",
    title: "仮定法",
    desc: "\"仮定法 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-subjunctive",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  },
  {
    id: "misc",
    index: "11",
    title: "その他構文（強調・否定・無生物主語）",
    desc: "\"その他構文 筋\"をバルクアップ！",
    comingSoon: false,
    count: 20,
    embedSrc: "embed-misc",
    modes: [
      { id: "order", label: "語句整序トレーニング" },
      { id: "instant", label: "瞬間英作文トレーニング" },
      { id: "list", label: "出題構文一覧" }
    ],
    questions: []
  }
];

/* ===================================================================== */

const cardBox = document.getElementById('cardBox');
const appEl = document.getElementById('app');
const quizWrap = document.getElementById('quizWrap');
const quizTitle = document.getElementById('quizTitle');
const quizBody = document.getElementById('quizBody');
const progFill = document.getElementById('progFill');
const backBtn = document.getElementById('backBtn');

let state = { itemId:null, qIndex:0, score:0, answered:false };

function renderMenu(){
  cardBox.innerHTML = '';
  GRAMMAR_ITEMS.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card' + (item.comingSoon ? ' disabled' : '') + (item.modes ? ' has-modes' : '');
    const progressText = getProgressText(item);
    card.innerHTML = `
      <span class="card-status ${item.comingSoon ? 'status-soon' : 'status-ready'}">${item.comingSoon ? '準備中' : (item.embedSrc ? '演習へ' : `全${item.questions.length}問`)}</span>
      <div class="card-top">
        <span class="card-index">NO.${item.index}</span>
      </div>
      <div class="card-title">${item.title}${item.count ? `（${item.count}問）` : ''}</div>
      <div class="card-desc">${item.desc}</div>
      ${progressText ? `<div class="card-progress">${progressText}</div>` : ''}
      ${item.modes ? `<div class="mode-choice"></div>` : ''}
    `;
    if(item.modes && !item.comingSoon){
      const choiceBox = card.querySelector('.mode-choice');
      item.modes.forEach(m=>{
        const btn = document.createElement('button');
        btn.className = 'mode-choice-btn';
        btn.textContent = m.label;
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          startQuiz(item.id, m.id);
        });
        choiceBox.appendChild(btn);
      });
    } else if(!item.comingSoon){
      card.addEventListener('click', ()=> startQuiz(item.id));
    }
    cardBox.appendChild(card);
  });
}

function getProgressText(item){
  if(item.embedSrc) return '';
  const rec = localStorage.getItem('progress_'+item.id);
  if(!rec || item.comingSoon) return '';
  const {score,total} = JSON.parse(rec);
  return `前回のスコア: ${score} / ${total}`;
}

function startQuiz(id, initialMode){
  const item = GRAMMAR_ITEMS.find(i=>i.id===id);
  if(!item) return;
  if(!item.embedSrc && !item.questions.length) return;

  state = { itemId:id, qIndex:0, score:0, answered:false };
  appEl.classList.add('on-quiz');
  quizWrap.classList.add('active');
  quizTitle.textContent = item.title;

  if(item.embedSrc){
    document.getElementById('progFill').parentElement.style.display = 'none';
    const tpl = document.getElementById(item.embedSrc);
    const html = tpl ? tpl.textContent.replaceAll('@@ENDSCRIPT_PLACEHOLDER@@', '</scr'+'ipt>') : '';
    const frame = document.createElement('iframe');
    frame.className = 'embed-frame';
    frame.title = item.title;
    frame.srcdoc = html;
    if(initialMode && initialMode !== 'order'){
      frame.addEventListener('load', ()=>{
        try{
          const doc = frame.contentWindow.document;
          const tab = doc.querySelector(`.mode-tab[data-mode="${initialMode}"]`);
          if(tab) tab.click();
        }catch(e){ /* ignore cross-origin or missing tab */ }
      });
    }
    quizBody.innerHTML = '';
    quizBody.appendChild(frame);
    return;
  }
  document.getElementById('progFill').parentElement.style.display = '';
  renderQuestion();
}

function backToMenu(){
  appEl.classList.remove('on-quiz');
  quizWrap.classList.remove('active');
  renderMenu();
}
backBtn.addEventListener('click', backToMenu);

function renderQuestion(){
  const item = GRAMMAR_ITEMS.find(i=>i.id===state.itemId);
  const total = item.questions.length;

  if(state.qIndex >= total){
    renderResult(item, total);
    return;
  }

  const q = item.questions[state.qIndex];
  state.answered = false;
  progFill.style.width = `${(state.qIndex/total)*100}%`;

  quizBody.innerHTML = `
    <div class="qcount">Q${state.qIndex+1} / ${total}</div>
    <div class="question-card">
      <span class="qtag">${q.tag}</span>
      <p class="qtext">${q.text}</p>
      <div class="options" id="optionsBox">
        ${q.options.map((opt,i)=>`
          <button class="option" data-i="${i}">
            <span class="opt-key">${String.fromCharCode(65+i)}</span><span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox">${q.explain}</div>
      <div class="next-row"><button class="next-btn" id="nextBtn">${state.qIndex+1<total ? '次の問題 →' : '結果を見る →'}</button></div>
    </div>
  `;

  document.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click', ()=> handleAnswer(parseInt(btn.dataset.i), q));
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    state.qIndex++;
    renderQuestion();
  });
}

function handleAnswer(i, q){
  if(state.answered) return;
  state.answered = true;
  const opts = document.querySelectorAll('.option');
  opts.forEach(o=> o.disabled = true);
  opts[q.answer].classList.add('correct');
  if(i !== q.answer){
    opts[i].classList.add('wrong');
  } else {
    state.score++;
  }
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

function renderResult(item, total){
  progFill.style.width = '100%';
  localStorage.setItem('progress_'+item.id, JSON.stringify({score:state.score, total}));
  const pct = Math.round((state.score/total)*100);
  let msg = '基礎から復習しよう。';
  if(pct===100) msg = '満点！この構文は完璧です。';
  else if(pct>=70) msg = 'よくできました。もう一息です。';

  quizBody.innerHTML = `
    <div class="qcount">RESULT</div>
    <div class="result-card">
      <div class="eyebrow" style="text-align:center;">${item.title} - 演習終了</div>
      <div class="result-score">${state.score}<span> / ${total}</span></div>
      <div class="result-msg">${msg}</div>
      <div class="result-actions">
        <button class="retry-btn" id="retryBtn">もう一度</button>
        <button class="menu-btn" id="menuBtn">メニューへ</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(item.id));
  document.getElementById('menuBtn').addEventListener('click', backToMenu);
}

renderMenu();
</script>

function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

    <div class="sub" id="modeSubtitle">語句を並べ替えて、仮定法を使った英文を組み立てよう。ただし、ピリオド(.)は省いていて、文頭の単語も小文字になっているよ！</div>
  </header>

  <div class="mode-tabs" id="modeTabs">
    <div class="mode-tab active" data-mode="order">語句整序トレーニング</div>
    <div class="mode-tab" data-mode="instant">瞬間英作文トレーニング</div>
    <div class="mode-tab" data-mode="list">出題構文一覧</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="quiz-area">
  <div class="status-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">1 / 20</div>
    <div class="timer-badge" id="timerBadge">⏱ 00:00</div>
  </div>
  <div class="round-note" id="roundNote"></div>

  <div class="card" id="quizCard">
    <!-- filled by JS -->
  </div>
  </div>

  <div id="list-view" class="list-view" style="display:none;"></div>

  <footer>全問正解になるまで、間違えた問題だけ繰り返し出題されます。</footer>
</div>

<script>
const QUESTIONS = [
  { cat:"仮定法過去", jp:"もし毎日ウェイトを持ち上げたら、私は歩く冷蔵庫のような見た目になるだろう。",
    chunks:["If", "I", "lifted", "weights", "every", "day,", "I", "would", "look", "like", "a", "walking", "refrigerator."] },
  { cat:"仮定法過去", jp:"もしダンベルが話せたら、「もう置いて」とジョンに懇願するだろう。",
    chunks:["If", "dumbbells", "could", "talk,", "they", "would", "beg", "John", "to", "put", "them", "down."] },
  { cat:"仮定法過去", jp:"人が振り向くような、もっとカッコいい腹筋があればいいのに。",
    chunks:["I", "wish", "I", "had", "a", "cooler", "six-pack", "that", "could", "turn", "heads."] },
  { cat:"仮定法過去", jp:"もしこの世にバーベルがなければ、ジョンは話す相手がいないだろう。",
    chunks:["If", "it", "were", "not", "for", "barbells", "in", "the", "world,", "John", "would", "have", "no", "one", "to", "talk", "to."] },
  { cat:"仮定法過去完了", jp:"もし脚トレの日をサボっていたら、階段から転げ落ちていただろう。",
    chunks:["If", "I", "had", "skipped", "leg", "day,", "I", "would", "have", "fallen", "down", "the", "stairs."] },
  { cat:"仮定法過去完了", jp:"もし彼がバーベルと会話し始めていたら、エミリーとのデートを忘れてしまっていただろう。",
    chunks:["If", "John", "had", "started", "to", "talk", "with", "the", "barbell,", "he", "would", "have", "forgotten", "the", "date", "with", "Emily."] },
  { cat:"仮定法過去完了", jp:"もっとまじめに筋トレをしてたらなぁ。",
    chunks:["I", "wish", "I", "had", "done", "my", "workouts", "more", "seriously."] },
  { cat:"仮定法過去完了", jp:"もし昨日、ジョンの助けがなかったら、私はこんな重いバーベルを持ち上げることができなかっただろう。",
    chunks:["If", "it", "had", "not", "been", "for", "John's", "help,", "I", "could", "not", "have", "lifted", "such", "a", "heavy", "barbell."] },
  { cat:"仮定法現在", jp:"トレーナーは、私がゆっくりとウェイトを持ち上げるべきだと強く言う。",
    chunks:["The", "trainer", "insists", "that", "I", "lift", "the", "weight", "slowly."] },
  { cat:"仮定法現在", jp:"使用後は全員がマシンを拭くことが不可欠だ。",
    chunks:["It", "is", "essential", "that", "every", "member", "wipe", "down", "the", "machine", "after", "use."] },
  { cat:"仮定法現在", jp:"コーチは、私にさらに腕立て伏せを10回するよう要求した。",
    chunks:["The", "coach", "demanded", "that", "I", "should", "do", "ten", "more", "push-ups."] },
  { cat:"仮定法現在", jp:"初心者はウォームアップを飛ばさないことが重要だ。",
    chunks:["It", "is", "important", "that", "beginners", "should", "not", "skip", "the", "warm-up."] },
  { cat:"仮定法未来", jp:"万が一ジムで鏡を見かけても、2時間も見つめ続けてはいけない。",
    chunks:["If", "you", "should", "see", "a", "mirror", "at", "the", "gym,", "do", "not", "stare", "at", "it", "for", "two", "hours."] },
  { cat:"仮定法未来", jp:"万が一私の筋肉が現れたら、パーティーを開くつもりだ。",
    chunks:["Should", "my", "muscles", "ever", "appear,", "I", "will", "throw", "a", "party."] },
  { cat:"仮定法未来", jp:"万が一ジムのプロテインシェイクが切れたら、大混乱になるだろう。",
    chunks:["If", "the", "gym", "should", "run", "out", "of", "protein", "shakes,", "chaos", "will", "break", "out."] },
  { cat:"ifを伴わない仮定法", jp:"もし私がもっと強かったら、泣かずに自分で買い物袋を運べるのに。",
    chunks:["Were", "I", "stronger,", "I", "could", "carry", "my", "own", "grocery", "bags", "without", "crying."] },
  { cat:"ifを伴わない仮定法", jp:"ジムがこんなに混んでいると知っていたら、朝5時に行っていただろう。",
    chunks:["Had", "I", "known", "the", "gym", "was", "this", "crowded,", "I", "would", "have", "gone", "at", "5", "a.m."] },
  { cat:"ifを伴わない仮定法", jp:"彼女はまるで筋肉があるかのように話すが、ダンベルに触れたことすらない。",
    chunks:["She", "talks", "as", "if", "she", "had", "muscles,", "but", "she", "has", "never", "touched", "a", "dumbbell."] },
  { cat:"ifを伴わない仮定法", jp:"まるで脚トレをさぼってしまったような気分だ。",
    chunks:["I", "feel", "as", "if", "I", "had", "skipped", "leg", "day."] },
  { cat:"ifを伴わない仮定法", jp:"プロテインシェイクがなければ、私は今も麺のように弱いままだろう。",
    chunks:["But", "for", "protein", "shakes,", "I", "would", "still", "be", "as", "weak", "as", "a", "noodle."] },
];

let round = 1;
let queue = QUESTIONS.map((_, i) => i); // question indices to attempt this round
let order = [];      // fixed order of question indices for the current round (doesn't mutate as you navigate)
let pos = 0;          // current position within order
let results = [];     // per-position state: {status:'unanswered'|'correct'|'wrong'|'skipped', poolOrder:[{ci,text}], answer:[ci,...]}
let totalInRound = 0;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文) | "list" (出題構文一覧)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(QUESTIONS.map(q=>q.cat)))];
let currentCat = "すべて";
let categoryPool = QUESTIONS.map((_, i) => i);

const card = document.getElementById('quizCard');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const roundNote = document.getElementById('roundNote');
const modeSubtitle = document.getElementById('modeSubtitle');
const timerBadge = document.getElementById('timerBadge');
const tabsEl = document.getElementById('tabs');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat === currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = QUESTIONS.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || QUESTIONS[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const q = QUESTIONS[idx];
      const sentence = q.chunks.join(' ');
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${q.cat}</span>
          <div class="list-jp">${q.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${sentence}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${q.explain ? ('<div class="explain-note">💡 ' + q.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speak(QUESTIONS[Number(btn.dataset.idx)].chunks.join(' '));
  });
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(QUESTIONS.map((_, i) => i));
  } else {
    categoryPool = QUESTIONS.map((_, i) => i).filter(i => currentCat === "すべて" || QUESTIONS[i].cat === currentCat);
  }
  round = 1;
  queue = categoryPool.slice();
  buildTabs();
  startTimer();
  startRound();
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '語句を並べ替えて、仮定法を使った英文を組み立てよう。ただし、ピリオド(.)は省いていて、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant'){
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(qIdx => {
    const chunks = QUESTIONS[qIdx].chunks;
    const poolOrder = shuffle(chunks.map((text, ci) => ({ci, text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundNote.textContent = round === 1 ? "" : `🔁 ${round}周目：間違えた／スキップした ${order.length} 問に再挑戦`;
  renderCurrent();
}

function updateProgress(){
  const resolved = results.filter(r => r.status !== 'unanswered').length;
  const pct = totalInRound === 0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + "%";
  progressLabel.textContent = `${pos+1} / ${totalInRound}`;
}

function renderCurrent(){
  updateProgress();
  const qIdx = order[pos];
  const q = QUESTIONS[qIdx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  card.innerHTML = `
    <span class="badge">${q.cat}</span>
    <div class="jp-prompt">${q.jp}</div>
    <div class="answer-zone placeholder" id="answerZone" style="${mode==='instant' ? 'display:none;' : ''}"></div>
    <div class="pool" id="pool" style="${mode==='instant' ? 'display:none;' : ''}"></div>
    <div class="actions">
      <button class="btn btn-nav" id="prevBtn">⏮ 前の問題に戻る</button>
      <button class="btn btn-check" id="checkBtn">答え合わせ</button>
      <button class="btn btn-reset" id="resetBtn">やり直す</button>
      <span class="spacer"></span>
      <button class="btn btn-nav" id="skipBtn">次の問題にスキップ ⏭</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="self-grade" id="selfGrade" style="display:none;">
      <button class="btn btn-check" id="gradeCorrectBtn">✓ 言えた（正解）</button>
      <button class="btn btn-reset" id="gradeWrongBtn">✗ 言えなかった</button>
    </div>
  `;

  if(mode === 'order'){
    renderPool();
    renderAnswer();
  }

  const prevBtn = document.getElementById('prevBtn');
  const checkBtn = document.getElementById('checkBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = () => { if(pos > 0){ pos -= 1; renderCurrent(); } };

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  resetBtn.onclick = () => {
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = () => {
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered){
    showFeedback(r, q);
  } else {
    hideFeedback();
  }
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function finishRound(){
  const retryQueue = order.filter((qIdx, i) => results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    round += 1;
    startRound();
  } else {
    renderDone();
  }
}

function renderPool(){
  const qIdx = order[pos];
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  const usedSet = new Set(r.answer);
  const poolEl = document.getElementById('pool');
  poolEl.innerHTML = '';
  r.poolOrder.forEach(item => {
    const el = document.createElement('div');
    const isUsed = usedSet.has(item.ci);
    el.className = 'chunk' + (isUsed ? ' used' : '');
    el.textContent = displayWord(item.text);
    el.onclick = () => {
      if(isUsed || answered) return;
      r.answer.push(item.ci);
      renderPool();
      renderAnswer();
    };
    poolEl.appendChild(el);
  });
}

function renderAnswer(){
  const q = QUESTIONS[order[pos]];
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  const zone = document.getElementById('answerZone');
  zone.classList.remove('correct','wrong');
  if(answered){
    if(r.status === 'correct') zone.classList.add('correct');
    if(r.status === 'wrong') zone.classList.add('wrong');
  }
  if(r.answer.length === 0){
    zone.classList.add('placeholder');
    zone.innerHTML = '';
    return;
  }
  zone.classList.remove('placeholder');
  zone.innerHTML = '';
  r.answer.forEach((ci, idx) => {
    const el = document.createElement('div');
    el.className = 'chunk';
    el.textContent = displayWord(q.chunks[ci]);
    el.onclick = () => {
      if(answered) return;
      r.answer.splice(idx,1);
      renderPool();
      renderAnswer();
    };
    zone.appendChild(el);
  });
}

function hideFeedback(){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

function showFeedback(r, q){
  const fb = document.getElementById('feedback');
  const selfGrade = document.getElementById('selfGrade');
  const correctSentence = q.chunks.join(' ');
  const explainHtml = q.explain ? ('<div class="explain-note">💡 ' + q.explain + '</div>') : '';
  if(r.status === 'correct'){
    selfGrade.style.display = 'none';
    fb.className = 'feedback show correct';
    fb.innerHTML = `
      ✅ 正解！ナイス構文力。
      <div class="model">${correctSentence}
        <button class="btn btn-speak" id="speakBtn" style="margin-left:8px;">🔊 もう一度発音を聞く</button>
      </div>
      ${explainHtml}
    `;
  } else if(r.status === 'wrong'){
    selfGrade.style.display = 'none';
    fb.className = 'feedback show wrong';
    fb.innerHTML = `
      ❌ 惜しい！この問題は後でもう一度出題されます。
      <div class="model">正解：${correctSentence}
        <button class="btn btn-speak" id="speakBtn" style="margin-left:8px;">🔊 もう一度発音を聞く</button>
      </div>
      ${explainHtml}
    `;
  } else if(r.status === 'revealed'){
    fb.className = 'feedback show';
    fb.style.background = '#101c3b';
    fb.style.border = '1px solid var(--line)';
    fb.style.color = 'var(--text)';
    fb.innerHTML = `
      ▸ 模範解答
      <div class="model">${correctSentence}
        <button class="btn btn-speak" id="speakBtn" style="margin-left:8px;">🔊 もう一度発音を聞く</button>
      </div>
      ${explainHtml}
    `;
    selfGrade.style.display = 'flex';
    document.getElementById('gradeCorrectBtn').onclick = () => { r.status = 'correct'; renderCurrent(); };
    document.getElementById('gradeWrongBtn').onclick = () => { r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  document.getElementById('speakBtn').onclick = () => speak(correctSentence);
  speak(correctSentence);
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const q = QUESTIONS[order[pos]];
  if(mode === 'order'){
    const isCorrect = r.answer.length === q.chunks.length &&
      r.answer.every((ci, i) => ci === i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function renderDone(){
  stopTimer();
  progressFill.style.width = "100%";
  progressLabel.textContent = `${categoryPool.length} / ${categoryPool.length}`;
  roundNote.textContent = "";
  card.innerHTML = `
    <div class="done-screen">
      <div class="emoji">🦍💪🏆</div>
      <h2>全問正解！筋肉痛ならぬ、脳肉痛お疲れ様。</h2>
      <p>「${currentCat}」の${categoryPool.length}問を一通りマスターしました。</p>
      <p style="color:var(--amber); font-weight:700; font-size:15px;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</p>
      <button class="btn btn-check" id="restartBtn">もう一度挑戦する</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = startFresh;
}

startFresh();

</script>

  .tabs{

    padding:4px 2px 12px;
  }
  .tab{

<body>

  <div class="watermark" aria-hidden="true">
    <span>🦍</span><span>🦍</span><span>🦍</span><span>🦍</span>
  </div>

  <div class="header">

    <h1 class="title">構文トレーニング</h1>
    <p class="subtitle" id="mode-subtitle">日本語を読んで、英単語を正しい順にタップして並べよう</p>
  </div>

  <div class="mode-tabs" id="mode-tabs">
    <div class="mode-tab active" data-mode="order">語句整序トレーニング</div>

  </div>

  <div class="tabs" id="tabs"></div>

  <div id="quiz-area">
  <div class="deck-wrap">
    <div class="progress-row">
      <span id="cat-count">0 / 0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="score">正解 0</span>
    </div>

    <div class="card">
      <div class="timer-badge" id="timer-badge">⏱ 00:00</div>
      <div class="card-label" id="card-label">名詞的用法</div>
      <div class="round-banner" id="round-banner"></div>
      <div id="quiz-body">
        <div class="jp-text" id="jp-text">読み込み中…</div>

        <div class="instruction" id="instruction">▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！</div>
        <div class="answer-row empty" id="answer-row"></div>

          <button class="btn primary" id="grade-correct-btn">✓ 言えた（正解）</button>

      </div>

    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">⏮ 前の問題に戻る</button>
      <button class="btn primary" id="check-btn">答え合わせ</button>

      <button class="btn" id="skip-btn">次の問題にスキップ ⏭</button>

<script>
const DATA = [
  {cat:"動名詞(基本用法)", jp:"毎朝腹筋を1000回やるのはジョンの日課だ。", en:"Doing 1,000 sit-ups every morning is John's daily routine.", tag:"動名詞(主語)"},
  {cat:"動名詞(基本用法)", jp:"彼の趣味はダンベルを集めることだ。", en:"His hobby is collecting dumbbells.", tag:"動名詞(補語)"},
  {cat:"動名詞(基本用法)", jp:"彼はジムに通うことをやめなかった。", en:"He didn't stop going to the gym.", tag:"動名詞(目的語)"},

  {cat:"動名詞の意味上の主語", jp:"彼がプロテインを3杯も飲んだことに私は驚いた。", en:"I was surprised at his drinking three protein shakes.", tag:"意味上の主語(his)"},
  {cat:"動名詞の意味上の主語", jp:"エミリーはジョンがデートをすっぽかしたことに文句を言った。", en:"Emily complained about John’s skipping a date.", tag:"意味上の主語(my)"},

  {cat:"否定の動名詞", jp:"脚トレをサボらないことが大事だ。", en:"Not skipping leg day is important.", tag:"否定の動名詞(主語)"},
  {cat:"否定の動名詞", jp:"彼はジムに行かなかったことを後悔している。", en:"He regrets not going to the gym.", tag:"否定の動名詞(目的語)"},

  {cat:"受動態の動名詞", jp:"彼はエミリーに怒られることを気にしていない。", en:"He doesn't mind being scolded by Emily.", tag:"受動態の動名詞"},
  {cat:"受動態の動名詞", jp:"そのバーベルたちは毎日ジョンに持ち上げられることを楽しんでいる。", en:"The barbells enjoy being lifted by John every day.", tag:"受動態の動名詞"},

  {cat:"完了動名詞", jp:"彼は10年間トレーニングを続けてきたことを誇りに思っている。", en:"He is proud of having trained for ten years.", tag:"完了動名詞"},
  {cat:"完了動名詞", jp:"彼は昨夜，脚トレをサボってしまったことを後悔している。", en:"He regrets having skipped leg day last night.", tag:"完了動名詞"},

  {cat:"It is no use Ving", jp:"泣いても無駄だ、腹筋は割れない。", en:"It is no use crying, your abs won't show.", tag:"It is no use Ving"},
  {cat:"It is no use Ving", jp:"言い訳をしても無駄だ。", en:"It is no use making excuses.", tag:"It is no use Ving"},

  {cat:"There is no Ving", jp:"そのバーベルを止めることはできない。", en:"There is no stopping the barbell.", tag:"There is no Ving"},
  {cat:"There is no Ving", jp:"彼が本気になったら止められない。", en:"There is no stopping him once he gets serious.", tag:"There is no Ving"},

  {cat:"worth Ving", jp:"このジムは行く価値がある。", en:"This gym is worth visiting.", tag:"be worth Ving"},
  {cat:"worth Ving", jp:"そのトレーニングは試す価値がある。", en:"That workout is worth trying.", tag:"be worth Ving"},

  {cat:"be used to Ving", jp:"彼は毎日プロテインを飲むことに慣れている。", en:"He is used to drinking protein every day.", tag:"be used to Ving"},
  {cat:"be used to Ving", jp:"私は重いバーベルを持ち上げることに慣れてきた。", en:"I have gotten used to lifting heavy barbells.", tag:"get used to Ving"},

  {cat:"look forward to Ving", jp:"彼は明日，ジムに行くことを楽しみにしている。", en:"He is looking forward to going to the gym.", tag:"look forward to Ving"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

  {cat:"第4文型", jp:"ジョンは私に新しいトレーニングメニューをくれた。", en:"John gave me a new workout plan.", tag:"第4文型(give型)"},
  {cat:"第4文型", jp:"彼は私に正しいフォームを教えてくれた。", en:"He taught me the correct form.", tag:"第4文型(give型)"},
  {cat:"第4文型", jp:"ジョンは私に新しいダンベルを買ってくれた。", en:"John bought me new dumbbells.", tag:"第4文型(buy型)"},
  {cat:"第4文型", jp:"ジョンは私にプロテインパンケーキを作ってくれた。", en:"John made me protein pancakes.", tag:"第4文型(buy型)"},

  {cat:"第5文型", jp:"そのプロテインを飲んで、ジョンはさらに強くなった。", en:"Drinking the protein made John even stronger.", tag:"第5文型(make)"},
  {cat:"第5文型", jp:"みんなは彼を「ジムの王様」と呼ぶ。", en:"Everyone calls him \"the king of the gym\".", tag:"第5文型(call)"},
  {cat:"第5文型", jp:"彼は、自分のバーベルを「相棒」と名付けた。", en:"He named his barbell \"Buddy\".", tag:"第5文型(name)"},
  {cat:"第5文型", jp:"彼はいつもジムのバーベルを清潔に保っている。", en:"He always keeps his gym barbell clean.", tag:"第5文型(keep)"},
  {cat:"第5文型", jp:"彼はその筋トレは挑戦しがいがあると感じた。", en:"He found the workout challenging.", tag:"第5文型(find)"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

<script type="text/plain" id="embed-passive"><!DOCTYPE html>
<html lang="ja">
<head>

<style>
  :root{

  }

  }

  .card-label{

    padding:4px 11px; border-radius:999px; margin-bottom:14px;
    align-self:flex-start;
  }
  .jp-text{
    font-size:16.5px; font-weight:600;
    line-height:1.75; color:var(--text); margin-bottom:18px;
  }
  .instruction{
    font-size:11.5px; color:var(--text-dim);
    letter-spacing:0.02em; margin-bottom:8px;
  }

  .answer-row{

    display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px;
    padding:12px;

  .answer-row.correct{ border-color:var(--correct); }
  .answer-row.shake{ animation:shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .word-bank{ display:flex; flex-wrap:wrap; gap:8px; flex:1; align-content:flex-start; }

  .chip{
    font-family:Georgia,"Times New Roman",serif; font-size:15px;

  }
