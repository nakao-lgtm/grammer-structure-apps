    padding:8px 12px; border-radius:20px;
    background:#101c3b; color:var(--text-dim); border:1px solid var(--line);
    cursor:pointer; transition:all .15s ease;
  }
  .tab.active{ background:var(--amber); color:var(--navy-deep); border-color:var(--amber); }

  .mode-tabs{
    width:100%; max-width:520px; display:none; gap:8px; margin-bottom:12px;
  }
  .mode-tab{
    flex:1; text-align:center; font-size:11.5px; font-weight:700;
    letter-spacing:.02em; padding:11px 8px; border-radius:10px;
    background:#101c3b; color:var(--text-dim); border:1px solid var(--line);
    cursor:pointer; transition:all .15s ease;
  }
  .mode-tab.active{ background:var(--amber); color:var(--navy-deep); border-color:var(--amber); }

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

      <div id="quiz-body">
        <div class="jp-text" id="jp-text">読み込み中…</div>

        <div class="instruction" id="instruction">▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！</div>
        <div class="answer-row empty" id="answer-row"></div>
        <div class="word-bank" id="word-bank"></div>
        <div class="feedback" id="feedback"></div>
        <div class="self-grade" id="self-grade" style="display:none;">
          <button class="btn primary" id="grade-correct-btn">✓ 言えた（正解）</button>
          <button class="btn" id="grade-wrong-btn">✗ 言えなかった</button>
        </div>
        <button class="replay-btn" id="replay-btn" type="button" style="display:none">🔊 もう一度発音を聞く</button>
      </div>
      <div id="complete-screen" class="complete-screen"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">⏮ 前の問題に戻る</button>
      <button class="btn primary" id="check-btn">答え合わせ</button>
      <button class="btn" id="retry-btn">やり直す</button>
      <button class="btn" id="skip-btn">次の問題にスキップ ⏭</button>
    </div>
  </div>
  </div>

  <div id="list-view" class="list-view" style="display:none;"></div>

<script>
const DATA = [
  {cat:"現在形", jp:"バーベルとダンベルは、トレーニーを決して裏切らない。", en:"Barbells and dumbbells never betray their trainees.", tag:"現在形", explain:"変わることのない事実や真理を表す場合には、現在形を用いる。"},

  {cat:"現在進行形", jp:"ジョンはこのジムに所属しているが、今日は自宅でトレーニングをしている。", en:"John belongs to this gym, but he is training at home today.", tag:"現在進行形", explain:"belong to~は状態動詞であるため、進行形にはならない。一方で、一時的にその動作を行っているときには、進行形を使うことが多い。本問の後半部分はそれにあたる。"},
  {cat:"現在進行形", jp:"上腕二頭筋が徐々に大きくなってきている。", en:"My biceps are growing bigger and bigger.", tag:"現在進行形", explain:"bocome, get, growなどの「～になる」という状態の変化を表す動詞を進行形にすると、「～になりつつある」という変化の途中を表す表現になる。比較級の表現とも併用されることが多い。"},

  {cat:"未来形", jp:"上腕二頭筋がパンパンになりそうだ。", en:"My biceps are going to get pumped.", tag:"未来形", explain:"状況から判断して、近い未来の予測を表す時には、be going to~を使う。"},
  {cat:"未来形", jp:"その200kgのバーベルは、まさにジョンによって持ち上げられようとしている。", en:"The 200kg barbell is about to be lifted by John.", tag:"未来形", explain:"「be about to V原形」で、「まさに～しようとしている」という差し迫った未来を表す。「going to V原形」よりも近い未来を示す。"},

  {cat:"未来進行形", jp:"明日の今頃、ジョンはジムでデッドリフトをしているだろう。", en:"John will be doing deadlifts at the gym this time tomorrow.", tag:"未来進行形"},

  {cat:"注意すべき未来形", jp:"トレーニングが終わったら、そのダンベルを私に渡してください。", en:"Please pass me the dumbbell when you finish your workout.", tag:"注意すべき未来形", explain:"時・条件を表す副詞節の中では、未来のことでもwillを使わず、現在形を用いる。未来の予測ではなく、実際に起こりうることと考えるからである。"},
  {cat:"注意すべき未来形", jp:"もしすべてのバーベルが使用中なら、私は自重トレーニングをします。", en:"If all of the barbells are in use, I will do bodyweight exercises.", tag:"注意すべき未来形", explain:"時・条件を表す副詞節の中では、未来のことでもwillを使わず、現在形を用いる。未来の予測ではなく、実際に起こりうることと考えるからである。"},
  {cat:"注意すべき未来形", jp:"エミリーはジョンがいつトレーニングが終わるか知らない。", en:"Emily doesn't know when John will finish his workouts.", tag:"注意すべき未来形", explain:"名詞節のwhen節で未来のことを表すときは、willを用いて未来を表す。副詞節のwhen節としっかり区別すること。"},
  {cat:"注意すべき未来形", jp:"エミリーは、ジョンがトレーニングの後に彼女を待っていてくれるかどうか知りたがっている。", en:"Emily wants to know if John will wait for her after his workouts.", tag:"注意すべき未来形", explain:"名詞節のif節で未来のことを表すときは、willを用いて未来を表す。副詞節のif節としっかり区別すること。"},

  {cat:"現在完了形", jp:"このジムに3年間通っているけど、200kgのデッドリフトには一度も挑戦したことがない。", en:"I have been at this gym for 3 years, but I have never tried the 200kg deadlift.", tag:"現在完了形", explain:"完了形には、継続・経験・完了の3用法があるが、副詞を使うことで使い分けができる。本問前半は、for 3 yearsと期間の表現があるため、継続用法。本問後半は、neverがあるため、経験用法。"},
  {cat:"現在完了形", jp:"ジョンはもう今日のトレーニングを終えたけど、私はまだ終えていない。", en:"John has already finished today's workout, but I haven't yet.", tag:"現在完了形", explain:"完了形には、継続・経験・完了の3用法があるが、副詞を使うことで使い分けができる。本問では、alreadyやyetがあるため、完了用法である。"},
  {cat:"現在完了形", jp:"私がジムに来てから、ジョンはずっと200kgのバーベルを持ち上げている。", en:"John has been lifting the 200kg barbell since I came to the gym.", tag:"現在完了形", explain:"現在完了進行形は、動作動詞の継続を表現する場合に使用する。状態動詞の継続の場合は通常の現在完了形を用いる。"},

  {cat:"過去完了形", jp:"ジョンがバーベルの重量を増やしたとき、私はすでに疲れ切っていた。", en:"I had already become exhausted when John increased the weight on the barbell.", tag:"過去完了形", explain:"過去完了形では、「過去のある時点までの、継続・経験・完了」を表現する方法であるため、文中にはwhen節やuntil節などで、過去のある時点が明記されることが多い。本問では、when John increased the weight on the barbellが過去のある時点となる。"},
  {cat:"過去完了形", jp:"ジムに入会するまで、100kgのバーベルを持ち上げたことがなかった。", en:"I had never lifted a 100kg barbell before I joined the gym.", tag:"過去完了形", explain:"過去完了形では、「過去のある時点までの、継続・経験・完了」を表現する方法であるため、文中にはwhen節やuntil節などで、過去のある時点が明記されることが多い。本問では、before I joined the gymが過去のある時点となる。"},
  {cat:"過去完了形", jp:"エミリーがジムでジョンを見つけたとき、ジョンは3時間ずっと自分のバーベルとおしゃべりしていた。", en:"John had been chatting to his barbell for 3 hours when Emily found him at the gym.", tag:"過去完了形", explain:"過去完了進行形では、「過去のある時点までの動作動詞の継続」を表現する方法であるため、文中にはwhen節やuntil節などで、過去のある時点が明記されることが多い。本問では、when Emily found him at the gymが過去のある時点となる。"},

  {cat:"未来完了形", jp:"エミリーがジョンの家に着くころには、ジョンはもうジムに行ってしまっているだろう。", en:"John will have gone to the gym by the time Emily arrives at his house.", tag:"未来完了形", explain:"未来完了形では、「未来のある時点までの、継続・経験・完了」を表現する方法であるため、文中にはwhen節やif節、by the time S+Vなどで、未来のある時点が明記されることが多い。本問では、by the time Emily arrives at his houseが未来のある時点となるが、未来の時・条件を示す表現になるため、時制は現在時制を使用することに注意。"},
  {cat:"未来完了形", jp:"ジョンは来年でこのジムに所属して5年になる。", en:"John will have belonged to the gym for 5 years next year.", tag:"未来完了形", explain:"未来完了形では、「未来のある時点までの、継続・経験・完了」を表現する方法であるため、文中にはwhen節やif節、by the time S+Vなどで、未来のある時点が明記されることが多い。本問では、next yearが未来のある時点となる。"},

  {cat:"時制の一致", jp:"ジョンは、私がすぐにトレーニングをやめるだろうと思った。", en:"John thought that I would give up training soon.", tag:"時制の一致", explain:"主節の動詞が過去形になると、それに合わせて従属節の動詞も過去形や過去完了形になる。これを時制の一致という。本問では、主節のthoughtが過去形であるため、従属節であるthat節内も過去形になる。ここでは、willではなく、過去形のwouldに時制を一致させていることに注意。"},
  {cat:"時制の一致", jp:"私は、ジョンがちょうどジムに到着したものだと思っていた。", en:"I thought that John had just arrived at the gym.", tag:"時制の一致", explain:"主節の動詞が過去形になると、それに合わせて従属節の動詞も過去形や過去完了形になる。これを時制の一致という。本問では、主節のthoughtが過去形であるため、従属節であるthat節内も過去形になる。ここでは、現在完了形のhave just arrivedではなく、過去完了形のhad just arrivedに時制を一致させていることに注意。"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();
