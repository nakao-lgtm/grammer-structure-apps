  .chip.placed{ background:var(--navy-deep); color:var(--text); border-color:var(--amber); }
  .answer-row.correct .chip.placed{ background:#0f3327; border-color:var(--correct); color:var(--correct); }
  .answer-row.revealed .chip.placed{ background:#3a1620; border-color:var(--wrong); color:#ffb3bd; cursor:default; }

  .feedback{
    font-size:12.5px;
    margin-top:4px; min-height:18px; letter-spacing:0.02em; line-height:1.6;
  }
  .feedback.correct{ color:var(--correct); }
  .feedback.reveal{ color:var(--amber); }

  .round-banner{
    font-size:11px;
    color:var(--pink); letter-spacing:0.02em; margin:-4px 0 12px;
    min-height:14px;
  }

  .replay-btn{
    margin-top:10px;
    font-size:11.5px;
    color:var(--text); letter-spacing:0.02em;
    background:transparent; border:1px solid #3a4d80;
    border-radius:10px; padding:8px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:all .15s ease;
  }
  .replay-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .replay-btn.speaking{ opacity:0.6; cursor:wait; }

  .complete-screen{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
    padding:20px 10px;
  }
  .complete-screen .emoji{ font-size:44px; }
  .complete-screen .title2{
    font-size:20px; font-weight:800; color:var(--text);
  }
  .complete-screen .sub2{
    font-size:12px; color:var(--text-dim);
    letter-spacing:0.02em;
  }

  .list-view{
    width:100%; max-width:520px;

    background:#101c3b; border:1px solid var(--line);

  .self-grade{ display:flex; gap:10px; margin-top:12px; }

  @media (max-width:400px){
    .jp-text{ font-size:15px; }

  .watermark{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;

    position:absolute; font-size:220px; opacity:0.045;
    filter:grayscale(1) brightness(1.6); user-select:none; transform:rotate(-14deg);
  }
  .watermark span:nth-child(1){ top:-40px; left:-60px; }
  .watermark span:nth-child(2){ top:38%; right:-90px; font-size:280px; transform:rotate(10deg);}
  .watermark span:nth-child(3){ bottom:-80px; left:10%; font-size:200px; transform:rotate(-6deg);}

</style>

</head>
<body>

  <div class="watermark" aria-hidden="true">
    <span>🦍</span><span>🦍</span><span>🦍</span><span>🦍</span>
  </div>

  <div class="header">
    <div class="eyebrow">Passive Voice Drill · 受動態</div>
    <h1 class="title">構文トレーニング</h1>
    <p class="subtitle" id="mode-subtitle">日本語を読んで、英単語を正しい順にタップして並べよう</p>
  </div>

  <div class="mode-tabs" id="mode-tabs">
    <div class="mode-tab active" data-mode="order">語句整序トレーニング</div>
    <div class="mode-tab" data-mode="instant">瞬間英作文トレーニング</div>
    <div class="mode-tab" data-mode="list">出題構文一覧</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="quiz-area">
  <div class="deck-wrap">
    <div class="progress-row">
      <span id="cat-count">0 / 0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="score">正解 0</span>
    </div>

    <div class="card">
      <div class="timer-badge" id="timer-badge">⏱ 00:00</div>
      <div class="card-label" id="card-label">名詞的用法</div>
      <div class="round-banner" id="round-banner"></div>
      <div id="quiz-body">
        <div class="jp-text" id="jp-text">読み込み中…</div>

        <div class="instruction" id="instruction">▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！</div>
        <div class="answer-row empty" id="answer-row"></div>
        <div class="word-bank" id="word-bank"></div>
        <div class="feedback" id="feedback"></div>
        <div class="self-grade" id="self-grade" style="display:none;">
          <button class="btn primary" id="grade-correct-btn">✓ 言えた（正解）</button>
          <button class="btn" id="grade-wrong-btn">✗ 言えなかった</button>

        <button class="replay-btn" id="replay-btn" type="button" style="display:none">🔊 もう一度発音を聞く</button>
      </div>
      <div id="complete-screen" class="complete-screen"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">⏮ 前の問題に戻る</button>
      <button class="btn primary" id="check-btn">答え合わせ</button>
      <button class="btn" id="retry-btn">やり直す</button>
      <button class="btn" id="skip-btn">次の問題にスキップ ⏭</button>
    </div>
  </div>
  </div>

  <div id="list-view" class="list-view" style="display:none;"></div>

<script>
const DATA = [
  {cat:"受動態の基本形", jp:"彼のメンタルは，バーベルとダンベルによって作られている。", en:"His mentality is built by barbells and dumbbells.", tag:"受動態の基本形"},
  {cat:"受動態の基本形", jp:"このジムは30年前に建てられた。", en:"This gym was built thirty years ago.", tag:"受動態の基本形"},
  {cat:"受動態の基本形", jp:"エミリーはジョンに「死ぬほどきつい筋トレによって何が作られるの？」と聞いた。", en:"Emily asked John, \"What is made by deadly workouts?\"", tag:"受動態の基本形"},

  {cat:"助動詞を使った受動態", jp:"重いバーベルは慎重に扱われなければならない。", en:"Heavy barbells must be handled carefully.", tag:"助動詞+受動態(must)"},
  {cat:"助動詞を使った受動態", jp:"バーベルも恋人も丁寧に扱うべきだ。", en:"Both barbells and lovers should be treated right.", tag:"助動詞+受動態(should)"},
  {cat:"助動詞を使った受動態", jp:"このバーベルはいつか折れてしまうかもしれない。", en:"This barbell might be broken someday.", tag:"助動詞+受動態(might)"},
  {cat:"助動詞を使った受動態", jp:"より大きな筋肉がこの腕に作られるだろう。", en:"Bigger biceps will be built on this arm.", tag:"助動詞+受動態(will)"},

  {cat:"完了形の受動態", jp:"そのジムは先月リニューアルされたばかりだ。", en:"That gym has just been renovated.", tag:"完了形の受動態"},
  {cat:"完了形の受動態", jp:"エミリーのジョンへの恋心はまだ砕けていない。", en:"Emily’s love for John has not been broken yet.", tag:"完了形の受動態"},

  {cat:"進行形の受動態", jp:"そのマシンは今、修理されている最中だ。", en:"That machine is being repaired now.", tag:"進行形の受動態"},
  {cat:"進行形の受動態", jp:"新しいジムが建設されている最中だ。", en:"A new gym is being built.", tag:"進行形の受動態"},
  {cat:"進行形の受動態", jp:"彼のフォームはコーチにチェックされている最中だ。", en:"His form is being checked by his coach.", tag:"進行形の受動態"},

  {cat:"感情表現の受動態", jp:"彼は自分の新記録に驚いた。", en:"He was surprised at his new record.", tag:"感情表現(surprised)"},
  {cat:"感情表現の受動態", jp:"私は筋トレにとても興味がある。", en:"I am very interested in weight training.", tag:"感情表現(interested)"},
  {cat:"感情表現の受動態", jp:"彼はその結果にわくわくしている。", en:"He is excited about the result.", tag:"感情表現(excited)"},
  {cat:"感情表現の受動態", jp:"彼はハードなトレーニングで疲れ果てている。", en:"He is exhausted from the hard training.", tag:"感情表現(exhausted)"},

  {cat:"SVOOの受動態", jp:"私は素敵なTシャツをもらったが，それは以前にジョンがエミリーからもらったものだった。", en:"I was given a nice T-shirt but it had been given to John by Emily.", tag:"SVOOの受動態"},
  {cat:"SVOOの受動態", jp:"そのTシャツはエミリーがジョンにトレーニング用で買ってくれた。", en:"The T-shirt was bought for John by Emily for his workouts.", tag:"SVOOの受動態"},

  {cat:"SVOCの受動態", jp:"そのバーベルは，みんなから「ジョンの相棒」と呼ばれている。", en:"The barbell is called \"John's Buddy\" by everybody.", tag:"SVOCの受動態"},
  {cat:"SVOCの受動態", jp:"ジョンはエミリーからジムに行くことを許された。", en:"John was allowed to go to the gym by Emily.", tag:"SVOCの受動態"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';

      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

      currentCat = cat;
      if(mode === 'list'){

      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

    <div class="mode-tab" data-mode="list">出題構文一覧</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="quiz-area">
  <div class="deck-wrap">
    <div class="progress-row">
      <span id="cat-count">0 / 0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="score">正解 0</span>
    </div>

    <div class="card">
      <div class="timer-badge" id="timer-badge">⏱ 00:00</div>
      <div class="card-label" id="card-label">名詞的用法</div>
      <div class="round-banner" id="round-banner"></div>
      <div id="quiz-body">
        <div class="jp-text" id="jp-text">読み込み中…</div>

        <div class="instruction" id="instruction">▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！</div>
        <div class="answer-row empty" id="answer-row"></div>
        <div class="word-bank" id="word-bank"></div>
        <div class="feedback" id="feedback"></div>
        <div class="self-grade" id="self-grade" style="display:none;">
          <button class="btn primary" id="grade-correct-btn">✓ 言えた（正解）</button>
          <button class="btn" id="grade-wrong-btn">✗ 言えなかった</button>
        </div>
        <button class="replay-btn" id="replay-btn" type="button" style="display:none">🔊 もう一度発音を聞く</button>
      </div>
      <div id="complete-screen" class="complete-screen"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">⏮ 前の問題に戻る</button>
      <button class="btn primary" id="check-btn">答え合わせ</button>
      <button class="btn" id="retry-btn">やり直す</button>
      <button class="btn" id="skip-btn">次の問題にスキップ ⏭</button>
    </div>
  </div>
  </div>

  <div id="list-view" class="list-view" style="display:none;"></div>

<script>
const DATA = [
  {cat:"原級を使った比較の文", jp:"エミリーは，ジョンは私と同じくらいバーベルのことが好きだと思っている。", en:"Emily thinks John likes his barbell as much as he likes her.", tag:"原級を使った比較の文"},
  {cat:"原級を使った比較の文", jp:"私はジョンと同じくらい一生懸命トレーニングするが、バーベルとは話さない。", en:"I train as hard as John does, but I do not talk to my barbell.", tag:"原級を使った比較の文"},
  {cat:"原級を使った比較の文", jp:"私はジョンほどバーベルに興味はない。", en:"I am not as interested in barbells as John is.", tag:"原級を使った比較の文"},
  {cat:"原級を使った比較の文", jp:"ジョンのダンベルは，私のものよりも3倍重い。", en:"John’s dumbbells are three times as heavy as mine.", tag:"原級を使った比較の文"},

  {cat:"比較級を使った比較の文", jp:"私の弟はジョンよりも5歳年下だが，彼よりははるかにまともだ。", en:"My little brother is five years younger but much more normal than John.", tag:"比較級を使った比較の文"},
  {cat:"比較級を使った比較の文", jp:"ジョンはエミリーよりバーベルとダンベルを大切にしている。", en:"John cares more about his barbells and dumbbells than about Emily.", tag:"比較級を使った比較の文"},
  {cat:"比較級を使った比較の文", jp:"ジョンはデートのときより、重いバーベルを持ち上げたときの方が幸せそうだ。", en:"John looks happier when he lifts a heavy barbell than when he goes on a date.", tag:"比較級を使った比較の文"},
  {cat:"比較級を使った比較の文", jp:"このプロテインはあのプロテインほど甘くない。", en:"This protein shake is less sweet than that one.", tag:"比較級を使った比較の文"},

  {cat:"最上級を使った比較の文", jp:"バーベルは、ジムで最も大切にしている相棒だ。", en:"The barbell is the most important partner at the gym.", tag:"最上級を使った比較の文"},
  {cat:"最上級を使った比較の文", jp:"エミリーとのデートは週で最も重要でない予定だ。", en:"A date with Emily is the least important plan of the week.", tag:"最上級を使った比較の文"},
  {cat:"最上級を使った比較の文", jp:"ジムは世界で,最も興奮する場所の一つである。", en:"The gym is one of the most exciting places in the world.", tag:"最上級を使った比較の文"},

  {cat:"原級・比較級を使った最上級の文", jp:"このバーベルほどジョンを長くジムに引き止めるものはない。", en:"Nothing keeps John at the gym as long as this barbell does.", tag:"原級・比較級を使った最上級の文"},
  {cat:"原級・比較級を使った最上級の文", jp:"私ほどジョンのバーベルの話を聞いている人はいない。", en:"No one listens to John's stories about his barbell more often than I do.", tag:"原級・比較級を使った最上級の文"},
  {cat:"原級・比較級を使った最上級の文", jp:"エミリーとのデートは、ジムにある他のどのダンベルよりも重い。", en:"Dates with Emily are heavier than any other dumbbell in the gym.", tag:"原級・比較級を使った最上級の文"},
  {cat:"原級・比較級を使った最上級の文", jp:"ジョンは、ジムにいる誰よりもバーベルと長く話す。", en:"John talks to his barbell longer than anyone else at the gym.", tag:"原級・比較級を使った最上級の文"},

  {cat:"慣用表現", jp:"ジョンはできるだけ重いダンベルを持ち上げようとした。", en:"John tried to lift as heavy a dumbbell as possible.", tag:"慣用表現"},
  {cat:"慣用表現", jp:"ジョンはエミリーとデートするというより、ジムで筋トレすることに興味がある。", en:"John is not so much interested in dating Emily as in working out at the gym.", tag:"慣用表現"},
  {cat:"慣用表現", jp:"トレーニングがきつくなればなるほど、ジョンはバーベルに話しかけるようになった。", en:"The harder the workout became, the more John talked to his barbell.", tag:"慣用表現"},
  {cat:"慣用表現", jp:"ジムに長くいればいるほど、ジョンはエミリーとのデートを忘れていった。", en:"The longer John stayed at the gym, the more he forgot about his date with Emily.", tag:"慣用表現"},
  {cat:"慣用表現", jp:"バーベルは私をもっとも裏切らない。", en:"The barbell is the last thing to betray me.", tag:"慣用表現"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

<script>

  {cat:"関係代名詞(who/which/that)", jp:"エミリーはジョンに，「あなたが一番気になっている人は誰？」と尋ねた。", en:"Emily asked John, \"Who is the person you care about the most?\"", tag:"関係代名詞(who/which/that)", explain:"Who is the person?とYou care about the person the most.の2文が，the personを先行詞として，関係代名詞who(whom)で結ばれている。この文では，目的格の関係代名詞のため，省略が生じている。"},

  {cat:"関係代名詞(whose)", jp:"私は、ジョンがバーベルを親友だと思っている理由を知っている。", en:"I know why John thinks that his barbell is his best friend.", tag:"関係代名詞(whose)"},

  {cat:"関係代名詞(what)", jp:"ジョンが本当に必要としているものは、新しいダンベルだ。", en:"What John really needs is a new set of dumbbells.", tag:"関係代名詞(what)"},

  {cat:"関係副詞(where/when/why)", jp:"ジョンが毎日通う場所はジムだ。", en:"The place where John goes every day is the gym.", tag:"関係副詞(where/when/why)", explain:"The place is the gym.とJohn goes to the place every day.の2文が，the placeを先行詞として，場所を表す関係副詞のwhereによって結ばれている。whereは関係副詞のため，goes toのtoは不要であることに注意。"},
  {cat:"関係副詞(where/when/why)", jp:"私は、ジョンが250㎏を持ち上げた日のことを覚えている。", en:"I remember the day when John lifted 250kg.", tag:"関係副詞(where/when/why)", explain:"I remember the day.とJohn lifted 250kg on the day.の2文が，the dayを先行詞として，時を表す関係副詞のwhenによって結ばれている。"},
  {cat:"関係副詞(where/when/why)", jp:"君が自分に自信を持てない理由は、脚トレを避けているからだ。", en:"The reason why you can't have confidence in yourself is that you avoid leg days.", tag:"関係副詞(where/when/why)", explain:"The reason is that you avoid leg days.とYou can't have confidence in yourself for the reason.の2文が，the reasonを先行詞として，理由を表す関係副詞のwhyによって結ばれている。"},
  {cat:"関係副詞(where/when/why)", jp:"顧客と一緒にトレーニングすることが、ジョンが彼らを説得する方法だ。", en:"Training with John's clients is how he persuades them.", tag:"関係副詞(where/when/why)", explain:"方法や手段を表す関係副詞howは，howの代わりにthe wayを使って，「Training with John's clients is the way he persuades them.」と表すこともできる。"},

  {cat:"非制限用法", jp:"ジョンは、私のトレーニング仲間であり、バーベルの親友でもある。", en:"John, who is my training partner, is also the best friend of his barbell.", tag:"非制限用法"},

  {cat:"非制限用法", jp:"2025年、私がこの町に引っ越してきたのだが、ジムでジョンに出会った。", en:"In 2025, when I moved to this town, I met John at the gym.", tag:"非制限用法"},

  {cat:"複合関係詞", jp:"彼はトレーニングを始めようとする人は誰でも歓迎する。", en:"He welcomes whoever starts training.", tag:"複合関係詞"},

  {cat:"複合関係詞", jp:"ジョンは何をエミリーに言われても、結局ジムに行く。", en:"Whatever Emily says to John, he goes to the gym in the end.", tag:"複合関係詞"},
  {cat:"複合関係詞", jp:"ジョンはどんなに忙しくても、バーベルと話す時間を作る。", en:"However busy John is, he makes time to talk to his barbell.", tag:"複合関係詞"},
  {cat:"複合関係詞", jp:"どのトレーニングを選んでも、それは私たちをより強くしてくれる。", en:"No matter which workout we choose, it will make us stronger.", tag:"複合関係詞"},
  {cat:"複合関係詞", jp:"どれだけトレーニングがきつくても、ジョンは決して諦めない。", en:"No matter how hard the workouts are, John never gives up.", tag:"複合関係詞"},

  {cat:"慣用表現", jp:"重そうに見えるようなバーベルに挑戦しなさい。", en:"Try such a barbell as will look heavy.", tag:"慣用表現", explain:"asは「such + 名詞」を先行詞として，主格の関係代名詞として働く。"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category

let order = [];          // fixed index order for the current round
let pos = 0;             // position within order

let roundNumber = 1;
let totalInRound = 0;

let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

          <button class="btn primary" id="grade-correct-btn">✓ 言えた（正解）</button>
          <button class="btn" id="grade-wrong-btn">✗ 言えなかった</button>
        </div>
        <button class="replay-btn" id="replay-btn" type="button" style="display:none">🔊 もう一度発音を聞く</button>
      </div>
      <div id="complete-screen" class="complete-screen"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">⏮ 前の問題に戻る</button>
      <button class="btn primary" id="check-btn">答え合わせ</button>
      <button class="btn" id="retry-btn">やり直す</button>
      <button class="btn" id="skip-btn">次の問題にスキップ ⏭</button>
    </div>
  </div>
  </div>

  <div id="list-view" class="list-view" style="display:none;"></div>

<script>
const DATA = [
  {cat:"can/could/be able to", jp:"ジョンは来月にも250㎏のバーベルを持ち上げることができるだろう。", en:"John will be able to lift the 250kg barbell in a month.", tag:"can/could/be able to"},
  {cat:"can/could/be able to", jp:"このダンベルを使ってもよろしいですか。", en:"Can I use this dumbbell?", tag:"can/could/be able to"},
  {cat:"can/could/be able to", jp:"ジョンがエミリーとデートに行くはずがない。", en:"John can't go on a date with Emily.", tag:"can/could/be able to"},

  {cat:"may/might", jp:"彼は今ジムでトレーニングをしているかもしれない。", en:"He may be training at the gym now.", tag:"may/might"},

  {cat:"must/have to", jp:"ここでそんな重いバーベルを挙げてはいけません。", en:"You must not lift such a heavy barbell here.", tag:"must/have to"},
  {cat:"must/have to", jp:"バーベルはみんなのためにきれいにしておかなければなりません。", en:"Barbells have to be kept clean for everyone.", tag:"must/have to"},
  {cat:"must/have to", jp:"これ以上，プロテインを飲む必要はありません。", en:"You don't have to drink protein shakes anymore.", tag:"must/have to"},
  {cat:"must/have to", jp:"彼はマッチョに違いない。", en:"He must be muscular.", tag:"must/have to"},

  {cat:"should/ought to", jp:"ジョンはもっと真剣にエミリーの声に耳を傾けるべきだ。", en:"John should listen to Emily more carefully.", tag:"should/ought to"},
  {cat:"should/ought to", jp:"どのトレーニングも真剣に行うべきである。", en:"Every workout ought to be done seriously.", tag:"should/ought to"},
  {cat:"should/ought to", jp:"君の上腕二頭筋が張っているはずだ。", en:"Your biceps should feel tight.", tag:"should/ought to"},

  {cat:"had better", jp:"今日は休みを取りなさい。", en:"You had better take a day off today.", tag:"had better"},

  {cat:"will/would", jp:"次のセットでは重量を増やすつもりです。", en:"I will increase the weight in the next set.", tag:"will/would"},
  {cat:"will/would", jp:"その重いバーベルがどうしても動かなかった。", en:"The heavy barbell wouldn't move.", tag:"will/would"},
  {cat:"will/would", jp:"よく脚トレをサボったものだ。", en:"I would often skip leg days.", tag:"will/would"},

  {cat:"used to", jp:"かつては100㎏のバーベルが怖かったものだが，今は200kg以上を持ち上げるのに慣れている。", en:"I used to be terrified of the 100kg barbells, but I am used to lifting more than 200kg now.", tag:"used to", explain:"前半のused to V原形は「かつては～したものだ」という助動詞のused to。後半のbe used to Vingは「～することに慣れている」という慣用表現。しっかり区別しておこう。"},

  {cat:"助動詞+have+過去分詞", jp:"ジョンは今日のエミリーとのデートをすっぽかしたに違いない。", en:"John must have missed his date with Emily.", tag:"助動詞+have+過去分詞"},
  {cat:"助動詞+have+過去分詞", jp:"エミリーはそんなことぐらいで打ちのめされるはずがない。", en:"Emily can't have been beaten down for such a thing.", tag:"助動詞+have+過去分詞"},
  {cat:"助動詞+have+過去分詞", jp:"ジョンはバーベルと同じようにエミリーを丁寧に接するべきだ。", en:"John should have treated Emily right as well as barbells.", tag:"助動詞+have+過去分詞"},
  {cat:"助動詞+have+過去分詞", jp:"今日，少なくとも5セットはできたはずなのに。", en:"You could have finished at least 5 sets today.", tag:"助動詞+have+過去分詞"},

  {cat:"慣用表現", jp:"バーベルを持ち上げるぐらいなら，ダンベルプレスに挑戦したい。", en:"I would rather try dumbbell presses than lift a barbell.", tag:"慣用表現", explain:"「would rather 動詞の原形 than 動詞の原形」という形になり，thanを挟んで，動詞の原形同士の比較になることに注意。"},
  {cat:"慣用表現", jp:"自分の時間をエミリーに捧げるぐらいなら，勉強に使った方がましだ。", en:"I may as well spend my time studying as spend it with Emily.", tag:"慣用表現", explain:"「may/might as well 動詞の原形 as 動詞の原形」という形になり，後半のasを挟んで，動詞の原形同士の比較になることに注意。"},
  {cat:"慣用表現", jp:"君がすべきことは，バーベルを挙げ続けることだけだ。", en:"All you have to do is to keep on lifting barbell.", tag:"慣用表現", explain:"All you have to do is ( to ) do という形で，be動詞の後ろのtoは省略されることもある。"},
  {cat:"慣用表現", jp:"エミリーとバーベルを扱うときは，いくら注意してもしすぎることはない。", en:"You cannot be too careful when you treat barbell and Emily.", tag:"慣用表現"},
  {cat:"慣用表現", jp:"ジョンはそのような重いバーベルを持ち上げずにはいられなかった。", en:"John could not help lifting such a heavy barbell.", tag:"慣用表現", explain:"cannot help Ving または cannot help but V原形で，「～せずにはいられない」という意味。Butの場合は動詞の原形になることに注意。"},
];

const categories = ["すべて", "🎲 ランダム演習", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "すべて";
let categoryPool = [];   // indices into DATA for the selected category
let queue = [];          // indices to attempt in the upcoming round
let order = [];          // fixed index order for the current round
let pos = 0;             // position within order
let results = [];        // per-position: {status, poolOrder:[{ci,text}], answer:[ci,...]}
let roundNumber = 1;
let totalInRound = 0;
let allDone = false;
let mode = "order"; // "order" (語句整序) | "instant" (瞬間英作文)
let timerInterval = null;
let timerStartMs = 0;
let finalElapsedMs = null;

const tabsEl = document.getElementById('tabs');
const jpText = document.getElementById('jp-text');
const cardLabel = document.getElementById('card-label');
const roundBanner = document.getElementById('round-banner');
const quizBody = document.getElementById('quiz-body');
const completeScreen = document.getElementById('complete-screen');
const answerRow = document.getElementById('answer-row');
const wordBank = document.getElementById('word-bank');
const feedback = document.getElementById('feedback');
const catCount = document.getElementById('cat-count');
const scoreEl = document.getElementById('score');
const progressFill = document.getElementById('progress-fill');
const replayBtn = document.getElementById('replay-btn');
const instructionEl = document.getElementById('instruction');
const modeSubtitle = document.getElementById('mode-subtitle');
const selfGrade = document.getElementById('self-grade');
const gradeCorrectBtn = document.getElementById('grade-correct-btn');
const gradeWrongBtn = document.getElementById('grade-wrong-btn');
const timerBadge = document.getElementById('timer-badge');
const quizArea = document.getElementById('quiz-area');
const listViewEl = document.getElementById('list-view');

let lastSpokenText = '';
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window){
    cachedVoices = window.speechSynthesis.getVoices();
  }
}
refreshVoices();
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v => /^en/i.test(v.lang) && /US|GB/i.test(v.lang))
      || cachedVoices.find(v => /^en/i.test(v.lang))
      || null;
}

function speakEnglish(text){
  if(!('speechSynthesis' in window) || !text) return;
  lastSpokenText = text;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  utter.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  replayBtn.classList.add('speaking');
  utter.onend = ()=> replayBtn.classList.remove('speaking');
  utter.onerror = ()=> replayBtn.classList.remove('speaking');
  // slight delay avoids the voice list race condition right after page load
  window.speechSynthesis.speak(utter);
}

replayBtn.onclick = ()=>{
  if(lastSpokenText) speakEnglish(lastSpokenText);
};

function buildTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat===currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{
      if(cat === currentCat) return;
      currentCat = cat;
      if(mode === 'list'){
        buildTabs();
        renderListView();
      } else {
        startFresh();
      }
    };
    tabsEl.appendChild(btn);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stripPeriod(w){
  return w.replace(/\.$/, '');
}

function displayWord(w){
  const s = stripPeriod(w);
  if(/^(I|John|Emily)('s|'m|'ve|'ll|'d|'re)?$/.test(s)) return s;
  return s.length ? s[0].toLowerCase() + s.slice(1) : s;
}

function renderListView(){
  stopTimer();
  timerBadge.textContent = '⏱ --:--';
  let indices = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || currentCat === "🎲 ランダム演習" || DATA[i].cat === currentCat);
  if(currentCat === "🎲 ランダム演習") indices = shuffle(indices);

  listViewEl.innerHTML = `
    <div class="list-count">全${indices.length}問（${currentCat}）</div>
    ${indices.map((idx,n)=>{
      const item = DATA[idx];
      return `
        <div class="list-item">
          <span class="list-tag">${n+1}. ${item.cat}</span>
          <div class="list-jp">${item.jp}</div>
          <div class="list-en-row">
            <div class="list-en">${item.en}</div>
            <button class="list-speak-btn" data-idx="${idx}">🔊 発音</button>
          </div>
          ${item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : ''}
        </div>
      `;
    }).join('')}
  `;
  listViewEl.querySelectorAll('.list-speak-btn').forEach(btn=>{
    btn.onclick = ()=> speakEnglish(DATA[Number(btn.dataset.idx)].en);
  });
}

function startFresh(){
  if(currentCat === "🎲 ランダム演習"){
    categoryPool = shuffle(DATA.map((_,i)=>i));
  } else {
    categoryPool = DATA.map((_,i)=>i).filter(i => currentCat === "すべて" || DATA[i].cat === currentCat);
  }
  queue = categoryPool.slice();
  roundNumber = 1;
  allDone = false;
  buildTabs();
  startTimer();
  startRound();
}

function startRound(){
  order = queue.slice();
  totalInRound = order.length;
  pos = 0;
  results = order.map(idx=>{
    const words = DATA[idx].en.split(' ');
    const poolOrder = shuffle(words.map((text,ci)=>({ci,text})));
    return { status:'unanswered', poolOrder, answer:[] };
  });
  roundBanner.textContent = roundNumber === 1 ? '' : `▸ ${roundNumber}周目・まちがえた${order.length}問だけ再挑戦中`;
  quizBody.style.display = '';
  completeScreen.style.display = 'none';
  renderCurrent();
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  timerBadge.textContent = '⏱ 00:00';
  timerInterval = setInterval(()=>{
    timerBadge.textContent = '⏱ ' + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  finalElapsedMs = Date.now() - timerStartMs;
  timerBadge.textContent = '⏱ ' + formatElapsed(finalElapsedMs);
}

function updateProgress(){
  const resolved = results.filter(r=>r.status!=='unanswered').length;
  const pct = totalInRound===0 ? 0 : Math.round((resolved/totalInRound)*100);
  progressFill.style.width = pct + '%';
  catCount.textContent = `第${roundNumber}周 ${pos+1} / ${totalInRound}`;
  const correctCount = results.filter(r=>r.status==='correct').length;
  scoreEl.textContent = "正解 " + correctCount + " / " + totalInRound;
}

function renderCurrent(){
  updateProgress();
  const idx = order[pos];
  const item = DATA[idx];
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  cardLabel.textContent = item.cat;
  jpText.textContent = item.jp;
  feedback.textContent = '';
  feedback.className = 'feedback';
  replayBtn.style.display = 'none';
  selfGrade.style.display = 'none';

  if(mode === 'order'){
    answerRow.style.display = '';
    wordBank.style.display = '';
    renderPool();
    renderAnswer();
  } else {
    answerRow.style.display = 'none';
    wordBank.style.display = 'none';
  }

  const prevBtn = document.getElementById('prev-btn');
  const checkBtn = document.getElementById('check-btn');
  const retryBtn = document.getElementById('retry-btn');
  const skipBtn = document.getElementById('skip-btn');

  prevBtn.disabled = pos === 0;
  prevBtn.onclick = goPrev;

  checkBtn.disabled = answered;
  checkBtn.onclick = checkAnswer;

  retryBtn.onclick = ()=>{
    r.status = 'unanswered';
    r.answer = [];
    renderCurrent();
  };

  skipBtn.onclick = ()=>{
    if(r.status === 'unanswered'){ r.status = 'skipped'; }
    goForward();
  };

  if(answered) showFeedback(r, item);
}

function renderPool(){
  const r = results[pos];
  const answered = r.status !== 'unanswered';
  wordBank.innerHTML = '';
  if(answered) return;
  const usedSet = new Set(r.answer);
  r.poolOrder.forEach(t=>{
    if(usedSet.has(t.ci)) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = displayWord(t.text);
    chip.onclick = ()=>{
      r.answer.push(t.ci);
      renderPool();
      renderAnswer();
    };
    wordBank.appendChild(chip);
  });
}

function renderAnswer(){
  const idx = order[pos];
  const item = DATA[idx];
  const words = item.en.split(' ');
  const r = results[pos];
  const answered = r.status !== 'unanswered';

  answerRow.classList.remove('correct','revealed');
  if(answered){
    if(r.status==='correct') answerRow.classList.add('correct');
    else if(r.status==='wrong') answerRow.classList.add('revealed');
  }
  answerRow.classList.toggle('empty', r.answer.length===0);
  answerRow.innerHTML = '';
  r.answer.forEach((ci, i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip placed';
    chip.textContent = displayWord(words[ci]);
    if(!answered){
      chip.onclick = ()=>{
        r.answer.splice(i,1);
        renderPool();
        renderAnswer();
      };
    }
    answerRow.appendChild(chip);
  });
}

function checkAnswer(){
  const r = results[pos];
  if(r.status !== 'unanswered') return;
  const idx = order[pos];
  if(mode === 'order'){
    const words = DATA[idx].en.split(' ');
    const isCorrect = r.answer.length === words.length && r.answer.every((ci,i)=>ci===i);
    r.status = isCorrect ? 'correct' : 'wrong';
  } else {
    r.status = 'revealed';
  }
  renderCurrent();
}

function showFeedback(r, item){
  const explainHtml = item.explain ? ('<div class="explain-note">💡 ' + item.explain + '</div>') : '';
  if(r.status === 'correct'){
    feedback.innerHTML = '🎉 正解！ Perfect!<br>▸ ' + item.tag + ' — ' + item.en + explainHtml;
    feedback.className = 'feedback correct';
  } else if(r.status === 'wrong'){
    feedback.innerHTML = '△ 語順がちがうよ。<br>▸ 正解： ' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
  } else if(r.status === 'revealed'){
    feedback.innerHTML = '▸ 模範解答<br>' + item.en + explainHtml;
    feedback.className = 'feedback reveal';
    selfGrade.style.display = 'flex';
    gradeCorrectBtn.onclick = ()=>{ r.status = 'correct'; renderCurrent(); };
    gradeWrongBtn.onclick = ()=>{ r.status = 'wrong'; renderCurrent(); };
  } else {
    return;
  }
  replayBtn.style.display = 'inline-flex';
  replayBtn.onclick = ()=> speakEnglish(item.en);
  speakEnglish(item.en);
}

function goForward(){
  if(pos < order.length - 1){
    pos += 1;
    renderCurrent();
  } else {
    finishRound();
  }
}

function goPrev(){
  if(pos > 0){
    pos -= 1;
    renderCurrent();
  }
}

function finishRound(){
  const retryQueue = order.filter((idx,i)=> results[i].status !== 'correct');
  if(retryQueue.length > 0){
    queue = retryQueue;
    roundNumber += 1;
    startRound();
  } else {
    showComplete();
  }
}

function showComplete(){
  allDone = true;
  stopTimer();
  quizBody.style.display = 'none';
  completeScreen.style.display = 'flex';
  completeScreen.innerHTML = `
    <div class="emoji">🏆</div>
    <div class="title2">全問正解！お疲れさま！</div>
    <div class="sub2">「${currentCat}」の${categoryPool.length}問をすべて自力で並べられたよ</div>
    <div class="sub2" style="margin-top:6px; font-weight:700;">⏱ タイム： ${formatElapsed(finalElapsedMs)}</div>
    <button class="btn primary" id="restart-btn" style="margin-top:14px;">もう一度挑戦する</button>
  `;
  roundBanner.textContent = '';
  cardLabel.textContent = 'COMPLETE';
  progressFill.style.width = '100%';
  catCount.textContent = `第${roundNumber}周 完了`;
  document.getElementById('restart-btn').onclick = startFresh;
}

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const m = tab.dataset.mode;
    if(m === mode) return;
    mode = m;
    document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode === mode));
    if(mode === 'order'){
      modeSubtitle.textContent = '日本語を読んで、英単語を正しい順にタップして並べよう';
      instructionEl.textContent = '▸ 正しい語順に並べよう。ただし、ピリオド(.)は省いているよ！また、文頭の単語も小文字になっているよ！';
    } else if(mode === 'instant') {
      modeSubtitle.textContent = '日本語を見て、頭の中で瞬時に英作文してみよう';
      instructionEl.textContent = '▸ 英語で言ってみよう（声に出す／頭の中で作文）';
    } else {
      modeSubtitle.textContent = '出題される英文と和訳を一覧で確認できるよ';
    }

    if(mode === 'list'){
      quizArea.style.display = 'none';
      listViewEl.style.display = 'flex';
      buildTabs();
      renderListView();
    } else {
      listViewEl.style.display = 'none';
      quizArea.style.display = '';
      startFresh();
    }
  });
});

startFresh();

<script type="text/plain" id="embed-misc"><!DOCTYPE html>

<head>

<style>
  :root{

    --amber:#f2b134;
    --amber-soft:#f2b13433;
    --teal:#4fd1c5;

  .tabs{
    width:100%; max-width:520px; display:flex; flex-wrap:wrap; gap:6px;
    padding:4px 2px 12px;
  }
  .tab{
